<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Readiness Assessment — Manufacturing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>window.QRCode||document.write('<script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"><\/script>')</script>
<style>
:root{
  --ink:#0E1726; --ink-soft:#3A4A63; --mute:#7D8BA3; --faint:#AEB9CC;
  --line:#E4E9F2; --line-2:#EEF2F8; --paper:#FFFFFF; --canvas:#F6F8FC;
  --brand:#0B5CD8; --brand-deep:#073B8C; --brand-wash:#EAF1FE;
  --i1:#3B6FE0; --i2:#7A3FF2; --i3:#E6A21A; --i4:#16A34A; --i5:#0D9488; --i6:#E0457B; --i7:#D6453F;
  --good:#16A34A; --warn:#E0A100; --bad:#D6453F;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Cambria,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,monospace;
  --r:14px; --r-sm:9px; --shadow:0 1px 2px rgba(14,23,38,.05),0 8px 28px rgba(14,23,38,.07);
  --shadow-lg:0 2px 6px rgba(14,23,38,.06),0 24px 60px rgba(14,23,38,.13);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--canvas);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;font-size:16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ───────────── HOME ───────────── */
.home{max-width:560px;margin:0 auto;padding:64px 22px 40px;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.brandmark{display:flex;align-items:center;gap:11px;margin-bottom:38px}
.brandmark .lt{width:40px;height:40px;border-radius:8px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-weight:800;letter-spacing:-.5px;font-size:15px;font-family:var(--mono)}
.brandmark span{font-weight:650;font-size:15px;letter-spacing:.02em}
.brandmark span b{color:var(--brand)}
.home h1{font-family:var(--serif);font-size:38px;line-height:1.08;letter-spacing:-.02em;font-weight:600;margin-bottom:14px}
.home h1 em{font-style:italic;color:var(--brand)}
.home .lede{color:var(--ink-soft);font-size:16.5px;max-width:46ch;margin-bottom:34px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:7px}
.field input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);
  background:var(--canvas);transition:border-color .15s,background .15s;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--brand);background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;border-radius:var(--r-sm);font-weight:650;font-size:15.5px;
  transition:transform .08s,box-shadow .2s,background .2s;width:100%}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(11,92,216,.28)}
.btn-primary:hover{background:var(--brand-deep)}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--faint);background:var(--canvas)}
.divider-or{display:flex;align-items:center;gap:14px;margin:20px 0;color:var(--faint);font-size:12px;font-weight:700;letter-spacing:.1em}
.divider-or::before,.divider-or::after{content:"";height:1px;background:var(--line);flex:1}
.home-foot{margin-top:30px;font-size:12.5px;color:var(--faint);text-align:center}

/* ───────────── PARTICIPANT ───────────── */
.pt{max-width:640px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.pt-top{position:sticky;top:0;z-index:5;background:rgba(246,248,252,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:14px 20px 0}
.pt-top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pt-sess{font-family:var(--mono);font-size:12px;color:var(--mute);font-weight:600}
.pt-sess b{color:var(--ink)}
.pt-name-tag{font-size:12.5px;color:var(--ink-soft);font-weight:600;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-wrap{padding-bottom:12px}
.prog-track{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;width:0;background:var(--brand);border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.prog-meta{display:flex;justify-content:space-between;margin-top:7px;font-size:11.5px;color:var(--mute);font-weight:600}
.pt-body{flex:1;padding:8px 20px 130px}

/* welcome */
.pt-welcome{padding:38px 22px 40px;max-width:560px;margin:0 auto}
.pt-welcome .eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-bottom:14px}
.pt-welcome h2{font-family:var(--serif);font-size:30px;line-height:1.12;letter-spacing:-.015em;font-weight:600;margin-bottom:12px}
.pt-welcome p{color:var(--ink-soft);margin-bottom:8px}
.imp-preview{margin:24px 0;display:flex;flex-direction:column;gap:1px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.imp-preview-row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--paper);font-size:13.5px}
.imp-preview-row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.imp-preview-row .n{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:700;width:14px}
.imp-preview-row .nm{font-weight:600;color:var(--ink-soft)}
.imp-preview-row .qn{margin-left:auto;font-size:11px;color:var(--faint);font-weight:600}

/* imperative section header */
.imp-head{display:flex;align-items:flex-start;gap:13px;padding:24px 0 18px}
.imp-head .badge{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
  color:#fff;font-weight:800;font-family:var(--mono);font-size:15px;flex-shrink:0;box-shadow:0 4px 12px rgba(14,23,38,.14)}
.imp-head h3{font-family:var(--serif);font-size:22px;line-height:1.16;letter-spacing:-.01em;font-weight:600}
.imp-head .imp-sub{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-top:3px}

/* question card */
.q{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 18px 16px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:120px}
.q.answered{border-color:#CBE0CB;background:linear-gradient(0deg,rgba(22,163,74,.025),rgba(22,163,74,.025)),var(--paper)}
.q-dim{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.q-dim .qid{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--brand);
  background:var(--brand-wash);padding:2px 7px;border-radius:5px}
.q-dim .dimname{font-size:12.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.01em}
.q-text{font-size:15.5px;color:var(--ink);line-height:1.42;margin-bottom:15px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.sbtn{aspect-ratio:1/1;border:1.5px solid var(--line);border-radius:10px;background:var(--canvas);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:all .13s;position:relative;min-height:54px}
.sbtn .sn{font-size:19px;font-weight:750;color:var(--ink-soft);line-height:1}
.sbtn:hover{border-color:var(--brand);background:var(--brand-wash)}
.sbtn:active{transform:scale(.94)}
.sbtn.on{background:var(--brand);border-color:var(--brand);box-shadow:0 4px 14px rgba(11,92,216,.34)}
.sbtn.on .sn{color:#fff}
.scale-legend{display:flex;justify-content:space-between;margin-top:9px;font-size:10.5px;color:var(--faint);font-weight:600;letter-spacing:.02em}

/* sticky footer nav */
.pt-foot{position:fixed;bottom:0;left:0;right:0;z-index:6;
  background:linear-gradient(0deg,var(--canvas) 62%,rgba(246,248,252,0));padding:14px 20px 18px}
.pt-foot-inner{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.pt-foot .btn{width:auto}
.pt-foot .btn-next{flex:1}
.pt-foot .btn-back{padding-left:16px;padding-right:16px;flex-shrink:0}
.sect-count{font-size:11.5px;color:var(--mute);font-weight:700;text-align:center;flex-shrink:0;min-width:42px}

/* done screen */
.pt-done{padding:60px 24px;max-width:520px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80dvh}
.done-check{width:74px;height:74px;border-radius:50%;background:var(--good);display:grid;place-items:center;margin-bottom:24px;box-shadow:0 10px 30px rgba(22,163,74,.32);animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.pt-done h2{font-family:var(--serif);font-size:30px;font-weight:600;margin-bottom:12px;letter-spacing:-.01em}
.pt-done p{color:var(--ink-soft);margin-bottom:6px}
.your-scores{margin-top:30px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.your-scores .ys-title{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:14px;text-align:left}
.ys-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.ys-row .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ys-row .nm{font-size:12.5px;color:var(--ink-soft);font-weight:600;text-align:left;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ys-bar{width:84px;height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;flex-shrink:0}
.ys-bar i{display:block;height:100%;border-radius:3px}
.ys-row .v{font-family:var(--mono);font-size:12.5px;font-weight:700;width:26px;text-align:right}

/* ───────────── PRESENTER ───────────── */
.pr{display:grid;grid-template-columns:288px 1fr;min-height:100dvh}
.pr-rail{background:var(--ink);color:#fff;padding:22px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;overflow-y:auto}
.pr-rail .rail-brand{display:flex;align-items:center;gap:10px;padding:0 22px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:8px}
.pr-rail .rail-brand .lt{width:34px;height:34px;border-radius:7px;background:#fff;color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:13px;font-family:var(--mono)}
.pr-rail .rail-brand .rb-t{font-size:13px;font-weight:700;line-height:1.25}
.pr-rail .rail-brand .rb-s{font-size:10.5px;color:var(--faint);font-weight:600;letter-spacing:.04em}
.rail-label{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4);padding:14px 22px 8px}
.imp-nav{display:flex;flex-direction:column;padding:0 12px;gap:2px}
.imp-nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;text-align:left;transition:background .15s;width:100%;color:rgba(255,255,255,.82)}
.imp-nav button:hover{background:rgba(255,255,255,.07)}
.imp-nav button.active{background:rgba(255,255,255,.12);color:#fff}
.imp-nav .nbadge{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:11px;color:#fff;flex-shrink:0}
.imp-nav .nm{font-size:12.5px;font-weight:600;flex:1;line-height:1.2}
.imp-nav .nsc{font-family:var(--mono);font-size:12px;font-weight:700;color:rgba(255,255,255,.55)}
.imp-nav button.active .nsc{color:#fff}
.rail-foot{margin-top:auto;padding:16px 22px 4px;border-top:1px solid rgba(255,255,255,.1)}
.rail-stat{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.rail-stat .rs-l{font-size:11.5px;color:var(--faint);font-weight:600}
.rail-stat .rs-v{font-family:var(--mono);font-size:15px;font-weight:700}
.live-dot{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6EE7B7}
.live-dot i{width:7px;height:7px;border-radius:50%;background:#34D399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

.pr-main{padding:26px 30px 50px;overflow-x:hidden}
.pr-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.pr-head h1{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.015em;line-height:1.1}
.pr-head .ph-sub{color:var(--mute);font-size:13.5px;margin-top:4px;font-weight:500}
.join-pill{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 10px 18px;box-shadow:var(--shadow)}
.join-pill .jp-code{font-family:var(--mono);font-size:26px;font-weight:750;color:var(--ink);letter-spacing:.04em}
.join-pill .jp-code small{display:block;font-size:9.5px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:3px}
.join-pill .qrbox{background:#fff;padding:6px;border-radius:8px;border:1px solid var(--line);line-height:0}
.join-pill .qrbox img,.join-pill .qrbox canvas{display:block;width:120px;height:120px}
.btn-reveal{background:var(--good);color:#fff;padding:11px 18px;border-radius:var(--r-sm);font-weight:650;font-size:14px;width:auto;display:inline-flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(22,163,74,.28)}
.btn-reveal:hover{filter:brightness(1.06)}

/* dashboard grid */
.dash{display:grid;grid-template-columns:1.32fr 1fr;gap:18px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel-h{padding:15px 18px 0;display:flex;align-items:center;justify-content:space-between}
.panel-h .ph-t{font-size:12.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.panel-h .ph-meta{font-size:11px;color:var(--mute);font-weight:600}
.panel-b{padding:14px 18px 18px}

/* radar */
.radar-wrap{position:relative;width:100%;aspect-ratio:1/1;max-width:560px;margin:0 auto}
.radar-wrap svg{width:100%;height:100%;overflow:visible}
.rtoggle{display:flex;gap:4px;background:var(--canvas);border-radius:8px;padding:3px}
.rtoggle button{font-size:11px;font-weight:700;padding:5px 10px;border-radius:6px;color:var(--mute)}
.rtoggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* participant selector chips under radar */
.radar-people{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding:12px 10px 4px;border-top:1px solid var(--line-2);margin-top:6px}
.pchip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 10px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:650;color:var(--ink-soft);transition:all .14s;cursor:pointer;line-height:1}
.pchip:hover{border-color:var(--faint);background:var(--canvas)}
.pchip .pcdot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:2px solid transparent}
.pchip.on{color:#fff;border-color:transparent}
.pchip.dim{opacity:.42}
.pchip.mode{font-weight:750}
.pchip.mode.on{background:var(--ink);color:#fff}
.pchip.mode .pcdot{border-radius:3px}
/* axis tooltip */
.axis-tip{position:absolute;z-index:20;background:var(--ink);color:#fff;border-radius:11px;padding:11px 13px 10px;
  box-shadow:0 10px 30px rgba(14,23,38,.32);min-width:172px;max-width:230px;animation:popTip .14s ease-out;transform-origin:center bottom}
@keyframes popTip{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.axis-tip .at-q{font-family:var(--mono);font-size:10.5px;font-weight:700;color:#8FB4FF;margin-bottom:1px}
.axis-tip .at-d{font-size:12.5px;font-weight:700;line-height:1.25;margin-bottom:9px;color:#fff}
.axis-tip .at-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px}
.axis-tip .at-row:last-child{margin-bottom:0}
.axis-tip .at-sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.axis-tip .at-nm{flex:1;color:#E4E9F2;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.axis-tip .at-sc{font-family:var(--mono);font-weight:750;color:#fff}
.axis-tip .at-avg{border-top:1px solid rgba(255,255,255,.16);margin-top:7px;padding-top:7px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);font-weight:600}
.axis-tip .at-avg b{color:#fff;font-family:var(--mono)}
.axis-tip .at-x{position:absolute;top:6px;right:8px;font-size:14px;color:rgba(255,255,255,.5);cursor:pointer;line-height:1}
.axis-tip .at-none{font-size:11.5px;color:var(--faint)}

/* overall stat strip */
.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat .st-l{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:7px}
.stat .st-v{font-family:var(--mono);font-size:30px;font-weight:750;line-height:1;letter-spacing:-.02em}
.stat .st-v small{font-size:15px;color:var(--faint);font-weight:600}
.stat .st-foot{font-size:11.5px;color:var(--ink-soft);margin-top:6px;font-weight:600}
.maturity-chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;margin-top:6px}

/* imperative bars */
.ibar{margin-bottom:13px}
.ibar:last-child{margin-bottom:0}
.ibar-top{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.ibar-top .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ibar-top .nm{font-size:13px;font-weight:600;color:var(--ink);flex:1;cursor:pointer}
.ibar-top .nm:hover{color:var(--brand)}
.ibar-top .v{font-family:var(--mono);font-size:13px;font-weight:750}
.ibar-top .sp{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--faint);margin-left:6px}
.ibar-track{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden;position:relative}
.ibar-track i{display:block;height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.ibar-track .tick{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:rgba(14,23,38,.16)}

/* AI inference feed */
.feed{display:flex;flex-direction:column;gap:10px}
.insight{border:1px solid var(--line);border-radius:11px;padding:12px 14px;position:relative;background:var(--paper);animation:slideIn .45s cubic-bezier(.2,.7,.3,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.insight.k-strength{background:linear-gradient(0deg,rgba(22,163,74,.04),rgba(22,163,74,.04)),#fff;border-color:#CDE8CD}
.insight.k-gap{background:linear-gradient(0deg,rgba(214,69,63,.045),rgba(214,69,63,.045)),#fff;border-color:#F2CFCD}
.insight.k-divergence{background:linear-gradient(0deg,rgba(224,161,0,.05),rgba(224,161,0,.05)),#fff;border-color:#EFE0B0}
.insight.k-consensus{background:linear-gradient(0deg,rgba(11,92,216,.04),rgba(11,92,216,.04)),#fff;border-color:#CFE0FB}
.insight .ins-tag{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin-bottom:6px}
.k-strength .ins-tag{color:var(--good)} .k-gap .ins-tag{color:var(--bad)}
.k-divergence .ins-tag{color:#B7860B} .k-consensus .ins-tag{color:var(--brand)}
.insight .ins-tag .ic{width:14px;height:14px}

<script>
/* ════════════════════════════════════════════════════════════════════════

/* ════════════════════════════════════════════════════════════════════════
   FRAMEWORK — 7 Imperatives × 5 dimensions (swap this block to change framework)
   ════════════════════════════════════════════════════════════════════════ */
const IMPERATIVES = [
  { n:1, name:"AI Strategy", short:"Strategy", sub:"Strategic approach across plants & value streams", color:"var(--i1)", hex:"#3B6FE0",
    q:[
      ["1.1","Operating Model Alignment","How well is the organization aligning AI strategy to plant operations, value streams, and production priorities?"],
      ["1.2","Smart Factory Roadmap","How well is the organization defining a multi-plant AI roadmap (3–5 years) linked to throughput, quality, cost, and delivery?"],
      ["1.3","Investment & ROI Targets","How clearly has the organization defined AI-linked targets for OEE, scrap, downtime, energy, and safety?"],
      ["1.4","Leadership Sponsorship","How effectively do manufacturing leaders sponsor and drive AI adoption across sites?"],
      ["1.5","Ecosystem & Scale Strategy","How effectively does the organization leverage partners and standard platforms to scale AI across plants?"],
  ]},
  { n:2, name:"AI Literacy", short:"Literacy", sub:"Workforce awareness, skills & trust", color:"var(--i2)", hex:"#7A3FF2",
    q:[
      ["2.1","Role-Based Skill Development","How well does the organization run structured AI training for operators, engineers, supervisors, and leadership?"],
      ["2.2","OT + AI Talent Availability","How effectively does the organization build talent at the intersection of AI, process engineering, automation, and OT?"],
      ["2.3","Shopfloor Adoption & Trust","How effectively does the organization build trust in AI through transparency, usability, and human-in-the-loop?"],
      ["2.4","Training Infrastructure & Certifications","How effective is the organization's capability to deliver repeatable industrial-AI training and certifications?"],
      ["2.5","Continuous Improvement Culture","How effectively does the organization integrate AI into Lean/CI routines (daily management, RCA, Kaizen)?"],
  ]},
  { n:3, name:"AI Data", short:"Data", sub:"OT/IT data readiness for AI", color:"var(--i3)", hex:"#E6A21A",
    q:[
      ["3.1","OT/IT Data Integration","How ready is the organization to integrate OT data (sensors, PLC, SCADA) with IT data (MES, ERP, QMS, SCM)?"],
      ["3.2","Data Quality & Context","How effective is the organization at ensuring data accuracy, timestamp alignment, genealogy, and context?"],
      ["3.3","Data Governance for Manufacturing","How structured is governance for master data, traceability, access control, and lifecycle across plants?"],
      ["3.4","Responsible AI for Operations","How effective is the organization at ensuring AI is transparent, auditable, and safe for quality/safety-critical decisions?"],
      ["3.5","Data Provenance & Auditability","How effectively does the organization trace raw signals → features → model outputs → operator actions → outcomes?"],
  ]},
  { n:4, name:"Governance & Sustenance", short:"Governance", sub:"Safe, compliant, responsible AI", color:"var(--i4)", hex:"#16A34A",
    q:[
      ["4.1","Safety & Quality Governance","How effective is governance in ensuring AI does not compromise worker safety, process safety, or product quality?"],
      ["4.2","Cybersecurity & OT Resilience","How effective are controls for secure AI deployment across edge devices, OT networks, and connected systems?"],
      ["4.3","Compliance & Audit Readiness","How effectively does the organization manage compliance (privacy, customer, regulatory audits, quality standards)?"],
      ["4.4","Explainability & Accountability","How effectively does the organization define accountability, decision rights, and explainability for AI actions?"],
      ["4.5","Model Lifecycle Controls","How effective is the organization at monitoring performance, detecting drift, retraining, and managing incidents?"],
  ]},
  { n:5, name:"Value Realization & Scalability", short:"Value & Scale", sub:"Measurable outcomes, scaled across plants", color:"var(--i5)", hex:"#0D9488",
    q:[
      ["5.1","Value Definition & KPI Baselines","How effectively does the organization define measurable outcomes (OEE, yield, scrap, FPY, MTBF/MTTR, energy) with baselines?"],
      ["5.2","Benefits Realization & ROI Tracking","How structured is the process to track realized benefits and sustain improvements beyond initial deployment?"],
      ["5.3","Pilot-to-Plant-to-Enterprise Scaling","How effective is the organization at moving from PoC → pilot line → plant rollout → multi-plant standardization?"],
      ["5.4","Standardization Across Plants","How effectively does the organization create reusable templates (data models, reference architectures, MLOps, SOPs)?"],
      ["5.5","Operating Model for Scale","How effective is the governance, funding, and ownership model to run AI as long-term production systems?"],
  ]},
  { n:6, name:"AI in Manufacturing", short:"In Manufacturing", sub:"AI embedded in core operations", color:"var(--i6)", hex:"#E0457B",
    q:[
      ["6.1","Production & Throughput Optimization","How ready is the organization to embed AI into production planning, line balancing, bottleneck prediction, and cycle-time?"],
      ["6.2","Quality & Yield Improvement","How ready is the organization to use AI for defect detection, RCA, process window control, and FPY improvement?"],
      ["6.3","Predictive Maintenance & Reliability","How ready is the organization to deploy AI for asset health, failure prediction, spares optimization, and downtime reduction?"],
      ["6.4","Energy & Resource Optimization","How ready is the organization to apply AI for energy management, utilities, emissions reduction, and resource efficiency?"],
      ["6.5","Shopfloor Deployment & Integration","How ready is the organization to integrate AI into MES/SCADA/automation workflows and sustain live operations?"],
  ]},
  { n:7, name:"AI Business", short:"Business", sub:"Use-case selection, ROI & change", color:"var(--i7)", hex:"#D6453F",
    q:[
      ["7.1","Use Case Prioritization","How structured is the organization's process to identify and prioritize AI use cases across plants and value streams?"],
      ["7.2","ROI Maturity for Operations","How structured is the process to quantify ROI and operational impact before, during, and after deployment?"],
      ["7.3","Pilot-to-Production Playbook","How effective is the playbook to industrialize AI (validation, changeover, SOP updates, training, acceptance criteria)?"],
      ["7.4","Cross-Functional Collaboration","How effective is collaboration across Operations, Quality, Maintenance, EHS, Supply Chain, Engineering, and IT/OT?"],
      ["7.5","Change Management in Plants","How effective is the organization at driving adoption across shifts, sites, unions, and local plant cultures?"],
  ]},
];
const ALLQ = IMPERATIVES.flatMap(im => im.q.map(([qid,dim,text]) => ({qid,dim,text,imp:im.n,hex:im.hex})));
const QBYID = Object.fromEntries(ALLQ.map(q=>[q.qid,q]));
const MATURITY = [
  {min:0,   label:"Experimental", color:"#D6453F"},
  {min:1.8, label:"Operational",  color:"#E6A21A"},
  {min:2.6, label:"Value-Driven", color:"#0D9488"},
  {min:3.4, label:"Strategic",    color:"#3B6FE0"},
  {min:4.3, label:"AI-Native",    color:"#16A34A"},
];
const maturityOf = v => { let m=MATURITY[0]; for(const t of MATURITY){ if(v>=t.min) m=t; } return m; };

/* ════════════════════════════════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════════════════════════════════ */
const $ = (s,r=document)=>r.querySelector(s);
const el = (tag,attrs={},...kids)=>{ const e=document.createElement(tag);
  for(const k in attrs){ if(k==="class")e.className=attrs[k]; else if(k==="html")e.innerHTML=attrs[k]; else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); }
  kids.flat().forEach(c=>e.append(c?.nodeType?c:document.createTextNode(c))); return e; };
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = v => v==null||isNaN(v) ? "–" : v.toFixed(1);
const qs = new URLSearchParams(location.search);
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); }
function genCode(){ return String(Math.floor(1000+Math.random()*9000)); }
function baseURL(){ return location.origin + location.pathname; }
function scoreColor(v){ if(v==null)return "var(--line)"; if(v<2)return "#D6453F"; if(v<2.8)return "#E6A21A"; if(v<3.6)return "#0D9488"; return "#16A34A"; }
function hexA(hex,a){ const h=hex.replace("#",""); const n=parseInt(h.length===3?h.split("").map(c=>c+c).join(""):h,16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
const PALETTE=["#0B5CD8","#7A3FF2","#E0457B","#16A34A","#E6A21A","#0D9488","#D6453F","#3B6FE0","#8B5CF6","#DB2777","#0EA5E9","#F97316","#65A30D","#BE123C"];
function mean(a){ return a.length? a.reduce((x,y)=>x+y,0)/a.length : null; }
function stdev(a){ if(a.length<2)return 0; const m=mean(a); return Math.sqrt(mean(a.map(x=>(x-m)**2))); }

/* ════════════════════════════════════════════════════════════════════════
   ROUTER
   ════════════════════════════════════════════════════════════════════════ */
(async function route(){
  const session = qs.get("s");
  const isPresent = qs.has("present");
  if(isPresent && session) return Presenter(session);
  if(session) return Participant(session);
  return Home();
})();

/* ════════════════════════════════════════════════════════════════════════
   HOME — create or join a session
   ════════════════════════════════════════════════════════════════════════ */
function Home(){
  const app=$("#app");
  app.innerHTML="";
  const wrap = el("div",{class:"home"});
  wrap.append(
    el("div",{class:"brandmark"},
      el("div",{class:"lt"},"LT"),
      el("span",{html:"<b>LTTS</b> · Digital Advisory"})
    ),
    el("h1",{html:'AI Readiness <em>Assessment</em>'}),
    el("p",{class:"lede"},"Run a live, multi-stakeholder maturity assessment across the seven manufacturing AI imperatives. Create a session, share the code, and watch the analysis build in real time."),
  );
  const card = el("div",{class:"card"});
  const titleInput = el("input",{type:"text",placeholder:"e.g. Acme Plant — Leadership Workshop",value:"AI Readiness Workshop"});
  card.append(
    el("div",{class:"field"}, el("label",{},"Session name"), titleInput),
    el("button",{class:"btn btn-primary",onclick:async()=>{
      const code=genCode();
      const {error}=await sb.from("ar_sessions").insert({id:code,title:titleInput.value||"AI Readiness Assessment"});
      if(error){ toast("Could not create session — check connection"); console.error(error); return; }
      location.href = `${baseURL()}?present=1&s=${code}`;
    }}, el("span",{html:"Create session &rarr;"})),
    el("div",{class:"divider-or"},"or join"),
    (()=>{ const j=el("input",{type:"text",placeholder:"Enter 4-digit session code",inputmode:"numeric",maxlength:"4"});
      const b=el("button",{class:"btn btn-ghost",onclick:()=>{ const c=j.value.trim(); if(c.length>=3) location.href=`${baseURL()}?s=${c}`; else toast("Enter a valid session code"); }},"Join as participant");
      const f=el("div",{class:"field"}, el("label",{},"Session code"), j); 
      const d=document.createDocumentFragment(); d.append(f,b); return d; })()
  );
  wrap.append(card, el("div",{class:"home-foot"},"7 imperatives · 35 questions · live aggregation"));
  app.append(wrap);
}

/* ════════════════════════════════════════════════════════════════════════
   PARTICIPANT — imperative-by-imperative survey
   ════════════════════════════════════════════════════════════════════════ */
async function Participant(session){
  const app=$("#app");
  // verify session
  const {data:sess} = await sb.from("ar_sessions").select("*").eq("id",session).maybeSingle();
  if(!sess){ app.innerHTML=`<div class="home"><div class="brandmark"><div class="lt">LT</div><span><b>LTTS</b></span></div><h1>Session not found</h1><p class="lede">Code <b>${esc(session)}</b> isn't active. Check the code with your facilitator.</p><a class="btn btn-ghost" href="${baseURL()}" style="text-decoration:none;max-width:260px">Back to start</a></div>`; return; }

  let participantId = localStorage.getItem(`ar_pid_${session}`);
  let name = localStorage.getItem(`ar_name_${session}`)||"";
  const answers = {}; // qid -> score
  let sectionIdx = -1; // -1 = welcome

  // restore answers if returning
  if(participantId){
    const {data:prev}=await sb.from("ar_responses").select("qid,score").eq("participant_id",participantId);
    (prev||[]).forEach(r=>answers[r.qid]=r.score);
  }

  function render(){
    app.innerHTML="";
    if(sectionIdx===-1) return renderWelcome();
    if(sectionIdx>=IMPERATIVES.length) return renderDone();
    renderSection(IMPERATIVES[sectionIdx]);
  }

  function renderWelcome(){
    const w=el("div",{class:"pt"});
    const body=el("div",{class:"pt-welcome"});
    body.append(
      el("div",{class:"eyebrow"},"AI Readiness · Manufacturing"),
      el("h2",{},sess.title),
      el("p",{},"You'll rate your organization on 35 questions across 7 imperatives. For each, pick where you honestly think the organization stands today — 1 (just starting) to 5 (AI-native)."),
      el("p",{html:"There are no wrong answers. Your individual responses feed a live picture of where the group aligns and where it doesn't."}),
    );
    const prev=el("div",{class:"imp-preview"});
    IMPERATIVES.forEach(im=> prev.append(
      el("div",{class:"imp-preview-row"},
        el("span",{class:"n"},String(im.n)),
        el("span",{class:"dot",style:`background:${im.hex}`}),
        el("span",{class:"nm"},im.name),
        el("span",{class:"qn"},`${im.q.length} Q`)
    )));
    body.append(prev);
    const nameInput=el("input",{type:"text",placeholder:"Your name",value:name,
      style:"width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:9px;background:#fff;margin-bottom:10px"});
    const roleInput=el("input",{type:"text",placeholder:"Your role (optional) — e.g. Plant Head, IT/OT Lead",value:localStorage.getItem(`ar_role_${session}`)||"",
      style:"width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:9px;background:#fff;margin-bottom:18px"});
    body.append(
      el("label",{style:"display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:8px"},"Before you begin"),
      nameInput, roleInput,
      el("button",{class:"btn btn-primary",onclick:async()=>{
        name=(nameInput.value||"").trim()||"Anonymous";
        const role=(roleInput.value||"").trim();
        localStorage.setItem(`ar_name_${session}`,name);
        localStorage.setItem(`ar_role_${session}`,role);
        if(!participantId){
          const {data,error}=await sb.from("ar_participants").insert({session_id:session,name,role:role||null}).select().single();
          if(error){ toast("Connection issue — try again"); return; }
          participantId=data.id; localStorage.setItem(`ar_pid_${session}`,participantId);
        } else {
          await sb.from("ar_participants").update({name,role:role||null}).eq("id",participantId);
        }
        sectionIdx=0; render(); window.scrollTo(0,0);
      }},el("span",{html:"Start assessment &rarr;"}))
    );
    w.append(body); app.append(w);
  }

  function answeredCount(){ return Object.keys(answers).length; }

  function renderSection(im){
    const w=el("div",{class:"pt"});
    // sticky top
    const top=el("div",{class:"pt-top"});
    const done=answeredCount();
    top.append(
      el("div",{class:"pt-top-row"},
        el("div",{class:"pt-sess",html:`Session <b>${esc(session)}</b>`}),
        el("div",{class:"pt-name-tag"},name||"Anonymous")
      ),
      el("div",{class:"prog-wrap"},
        el("div",{class:"prog-track"}, el("div",{class:"prog-fill",style:`width:${done/35*100}%`})),
        el("div",{class:"prog-meta"},
          el("span",{},`Imperative ${im.n} of 7 · ${im.name}`),
          el("span",{},`${done}/35 answered`)
        )
      )
    );
    // body
    const body=el("div",{class:"pt-body"});
    body.append(
      el("div",{class:"imp-head"},
        el("div",{class:"badge",style:`background:${im.hex}`},String(im.n)),
        el("div",{},
          el("h3",{},im.name),
          el("div",{class:"imp-sub"},im.sub)
        )
      )
    );
    im.q.forEach(([qid,dim,text])=>{
      const card=el("div",{class:"q"+(answers[qid]?" answered":""),id:`q-${qid}`});
      const scale=el("div",{class:"scale"});
      for(let s=1;s<=5;s++){
        const b=el("button",{class:"sbtn"+(answers[qid]===s?" on":""),onclick:async()=>{
          answers[qid]=s;
          // visual
          scale.querySelectorAll(".sbtn").forEach((x,i)=>x.classList.toggle("on",i+1===s));
          card.classList.add("answered");
          $(".prog-fill").style.width=`${answeredCount()/35*100}%`;
          $(".prog-meta").lastChild.textContent=`${answeredCount()}/35 answered`;
          // persist (upsert)
          await sb.from("ar_responses").upsert(
            {session_id:session,participant_id:participantId,qid,imperative:im.n,score:s},
            {onConflict:"participant_id,qid"}
          );
        }}, el("span",{class:"sn"},String(s)));
        scale.append(b);
      }
      card.append(
        el("div",{class:"q-dim"}, el("span",{class:"qid"},qid), el("span",{class:"dimname"},dim)),
        el("div",{class:"q-text"},text),
        scale,
        el("div",{class:"scale-legend"}, el("span",{},"1 · Experimental"), el("span",{},"5 · AI-Native"))
      );
      body.append(card);
    });
    // footer nav
    const foot=el("div",{class:"pt-foot"});
    const inner=el("div",{class:"pt-foot-inner"});
    if(im.n>1) inner.append(el("button",{class:"btn btn-ghost btn-back",onclick:()=>{sectionIdx--;render();window.scrollTo(0,0);}},"← Back"));
    inner.append(el("div",{class:"sect-count"},`${im.n}/7`));
    const lastSection = im.n===IMPERATIVES.length;
    inner.append(el("button",{class:"btn btn-primary btn-next",onclick:()=>{
      // soft-check this section answered
      const missing=im.q.filter(([qid])=>!answers[qid]).length;
      if(missing>0){ toast(`${missing} question${missing>1?"s":""} left in this imperative`); 
        const firstMiss=im.q.find(([qid])=>!answers[qid]); 
        if(firstMiss){ const e=$(`#q-${firstMiss[0]}`); e?.scrollIntoView({behavior:"smooth",block:"center"}); e?.animate([{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}],{duration:300}); }
        return; }
      sectionIdx++; render(); window.scrollTo(0,0);
    }}, el("span",{html: lastSection ? "Review &amp; submit &rarr;" : "Next imperative &rarr;"})));
    foot.append(inner);
    w.append(top,body,foot);
    app.append(w);
  }

  function renderDone(){
    // mark submitted
    sb.from("ar_participants").update({submitted:true}).eq("id",participantId);
    const w=el("div",{class:"pt"});
    const body=el("div",{class:"pt-done"});
    body.append(
      el("div",{class:"done-check",html:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'}),
      el("h2",{},"Responses submitted"),
      el("p",{},`Thanks, ${esc(name)}. Your assessment is now part of the live group picture.`),
      el("p",{html:"Keep this screen — the facilitator will walk through the combined results shortly."})
    );
    // personal score recap
    const ys=el("div",{class:"your-scores"});
    ys.append(el("div",{class:"ys-title"},"Your imperative scores"));
    IMPERATIVES.forEach(im=>{
      const vals=im.q.map(([qid])=>answers[qid]).filter(Boolean);
      const m=mean(vals);
      ys.append(el("div",{class:"ys-row"},
        el("span",{class:"dot",style:`background:${im.hex}`}),
        el("span",{class:"nm"},im.name),
        el("span",{class:"ys-bar"}, el("i",{style:`width:${(m||0)/5*100}%;background:${im.hex}`})),
        el("span",{class:"v"},fmt(m))
      ));
    });
    body.append(ys);
    body.append(el("button",{class:"btn btn-ghost",style:"margin-top:22px;max-width:280px",onclick:()=>{sectionIdx=0;render();window.scrollTo(0,0);}},"← Review my answers"));
    w.append(body); app.append(w);
  }

  render();
}

/* ════════════════════════════════════════════════════════════════════════
   PRESENTER — live dashboard
   ════════════════════════════════════════════════════════════════════════ */
async function Presenter(session){
  const app=$("#app");
  const {data:sess}=await sb.from("ar_sessions").select("*").eq("id",session).maybeSingle();
  if(!sess){ app.innerHTML=`<div class="home"><h1>Session ${esc(session)} not found</h1><a class="btn btn-ghost" href="${baseURL()}" style="max-width:240px;text-decoration:none">Start over</a></div>`; return; }

  // state
  let participants=[];   // {id,name,role,submitted}
  let responses=[];      // {participant_id,qid,imperative,score}
  let activeImp = 0;     // 0 = overview; 1..7 = focus
  let radarSel = "all";   // "avg" | "all" | <participantId> (isolate one person)
  let tooltipAxis = null; // index of axis whose tooltip is open

  // initial load
  async function loadAll(){
    const [{data:pp},{data:rr}] = await Promise.all([
      sb.from("ar_participants").select("*").eq("session_id",session).order("created_at"),
      sb.from("ar_responses").select("participant_id,qid,imperative,score").eq("session_id",session)
    ]);
    participants=pp||[]; responses=rr||[];
  }
  await loadAll();

  // ── derived analytics ──────────────────────────────────────────────────
  function respByQ(qid){ return responses.filter(r=>r.qid===qid).map(r=>r.score); }
  function impScores(impN){ // mean across all responses to that imperative's questions
    const v=responses.filter(r=>r.imperative===impN).map(r=>r.score); return mean(v);
  }
  function impSpread(impN){ const v=responses.filter(r=>r.imperative===impN).map(r=>r.score); return stdev(v); }
  function qMean(qid){ return mean(respByQ(qid)); }
  function overall(){ return mean(responses.map(r=>r.score)); }
  function participantImpMean(pid,impN){ const v=responses.filter(r=>r.participant_id===pid&&r.imperative===impN).map(r=>r.score); return mean(v); }
  function participantMean(pid){ const v=responses.filter(r=>r.participant_id===pid).map(r=>r.score); return mean(v); }
  function respondentCount(){ return new Set(responses.map(r=>r.participant_id)).size; }
  function pColor(pid){ const i=participants.findIndex(p=>p.id===pid); return PALETTE[(i<0?0:i)%PALETTE.length]; }
  function answeredPids(){ return participants.filter(p=>responses.some(r=>r.participant_id===p.id)).map(p=>p.id); }

  // ── INSIGHT ENGINE — rule-based "agents" recompute on every change ──────
  function computeInsights(){
    const out=[];
    const nResp=respondentCount();
    if(responses.length<3) return out;
    const impData = IMPERATIVES.map(im=>({im, mean:impScores(im.n), spread:impSpread(im.n), n:responses.filter(r=>r.imperative===im.n).length}))
                               .filter(d=>d.mean!=null);

    // 1) Strongest & weakest imperative
    const ranked=[...impData].filter(d=>d.n>=2).sort((a,b)=>b.mean-a.mean);
    if(ranked.length>=2){
      const top=ranked[0], bot=ranked[ranked.length-1];
      if(top.mean-bot.mean>=0.5){
        out.push({k:"strength",imp:top.im.n,score:1, body:`<b>${top.im.name}</b> is the group's strongest imperative at <b>${fmt(top.mean)}/5</b> — lead the transformation narrative here and use it as the proof point for what "good" looks like.`});
        out.push({k:"gap",imp:bot.im.n,score:-(5-bot.mean), body:`<b>${bot.im.name}</b> is the lowest at <b>${fmt(bot.mean)}/5</b>, ${(top.mean-bot.mean).toFixed(1)} pts below the top imperative. This is the most likely blocker to scaling AI — a natural Phase-1 focus.`});
      }
    }
    // 2) Sub-threshold imperatives (foundational risk)
    impData.filter(d=>d.n>=2&&d.mean<2.4).sort((a,b)=>a.mean-b.mean).slice(0,2).forEach(d=>{
      if(!out.some(o=>o.k==="gap"&&o.imp===d.im.n))
        out.push({k:"gap",imp:d.im.n,score:-(5-d.mean),body:`<b>${d.im.name}</b> sits in the experimental band (<b>${fmt(d.mean)}</b>). Deploying AI without addressing this first typically fails at go-live.`});
    });
    // 3) Divergence — where stakeholders most disagree (by imperative)
    const diverging=[...impData].filter(d=>d.n>=2&&d.spread>=1.1).sort((a,b)=>b.spread-a.spread);
    diverging.slice(0,2).forEach(d=>{
      out.push({k:"divergence",imp:d.im.n,score:d.spread,body:`Sharp disagreement on <b>${d.im.name}</b> (spread σ=${d.spread.toFixed(1)}). Some stakeholders see strength where others see a gap — worth surfacing live: <i>"why are we ${d.spread>1.4?"this far":"so"} apart here?"</i>`});
    });
    // 4) Question-level divergence (single sharpest split)
    let sharp=null;
    ALLQ.forEach(q=>{ const v=respByQ(q.qid); if(v.length>=3){ const sd=stdev(v); if(!sharp||sd>sharp.sd) sharp={q,sd,m:mean(v)}; } });
    if(sharp&&sharp.sd>=1.3){
      out.push({k:"divergence",imp:sharp.q.imp,score:sharp.sd,body:`The single most contested question is <b>${sharp.q.qid} ${sharp.q.dim}</b> (σ=${sharp.sd.toFixed(1)}, mean ${fmt(sharp.m)}). Answers span the full scale — likely a definition or visibility gap across functions.`});
    }
    // 5) Consensus strength — tight agreement at a high score
    const consensus=[...impData].filter(d=>d.n>=2&&d.spread<=0.55&&d.mean>=3.4).sort((a,b)=>b.mean-a.mean);
    if(consensus[0]){
      out.push({k:"consensus",imp:consensus[0].im.n,score:0.5,body:`Strong consensus on <b>${consensus[0].im.name}</b> — tight agreement (σ=${consensus[0].spread.toFixed(1)}) at <b>${fmt(consensus[0].mean)}</b>. This is settled; spend less workshop time here.`});
    }
    // 6) Overall maturity framing
    const ov=overall();
    if(ov!=null){
      const mt=maturityOf(ov);
      out.push({k:ov>=3?"consensus":"gap",imp:0,score:0.1,body:`Group overall maturity is <b>${fmt(ov)}/5 — ${mt.label}</b> across ${nResp} respondent${nResp>1?"s":""}. ${ov<2.4?"Foundational gaps dominate; sequence data and governance before use-case scale.":ov<3.4?"Building phase — connect data → decisions → people before scaling use cases.":"Strong base; the question shifts from <i>can we?</i> to <i>how fast can we scale?</i>"}`});
    }
    // de-dupe by (k+imp+body) and rank by |score|, cap
    const seen=new Set(); const uniq=[];
    out.sort((a,b)=>Math.abs(b.score)-Math.abs(a.score)).forEach(o=>{ const key=o.k+o.imp+o.body.slice(0,30); if(!seen.has(key)){seen.add(key);uniq.push(o);} });
    return uniq.slice(0,7);
  }

  // ── RENDER ──────────────────────────────────────────────────────────────
  function render(){
    app.innerHTML="";
    const pr=el("div",{class:"pr"});
    pr.append(renderRail(), renderMain());
    app.append(pr);
    drawRadar();
    renderQR();
  }

  function renderQR(){
    const box=$("#qr-box"); if(!box) return;
    const url=`${baseURL()}?s=${session}`;
    // Primary: client-side library (no network needed once page is loaded)
    if(window.QRCode && QRCode.toCanvas){
      const cv=document.createElement("canvas");
      QRCode.toCanvas(cv,url,{width:120,margin:0,color:{dark:"#0E1726",light:"#ffffff"}},(err)=>{
        if(!err){ box.innerHTML=""; cv.style.width="120px"; cv.style.height="120px"; box.append(cv); }
        else qrImageFallback(box,url);
      });
    } else {
      qrImageFallback(box,url);
    }
  }
  function qrImageFallback(box,url){
    const img=document.createElement("img");
    img.width=120; img.height=120; img.alt="Join QR code"; img.style.display="block";
    img.src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=0&qzone=1&data="+encodeURIComponent(url);
    img.onerror=()=>{ box.innerHTML='<div style="width:120px;height:120px;display:grid;place-items:center;font-size:10px;color:var(--mute);text-align:center;padding:8px">Scan unavailable —<br>join with the code</div>'; };
    box.innerHTML=""; box.append(img);
  }

  function renderRail(){
    const rail=el("div",{class:"pr-rail"});
    rail.append(
      el("div",{class:"rail-brand"},
        el("div",{class:"lt"},"LT"),
        el("div",{},
          el("div",{class:"rb-t"},"AI Readiness"),
          el("div",{class:"rb-s"},"Manufacturing · Live")
        )
      ),
      el("div",{class:"rail-label"},"Imperatives")
    );
    const nav=el("div",{class:"imp-nav"});
    // overview
    nav.append(el("button",{class:activeImp===0?"active":"",onclick:()=>{activeImp=0;render();}},
      el("span",{class:"nbadge",style:"background:linear-gradient(135deg,#3B6FE0,#7A3FF2)"},"∑"),
      el("span",{class:"nm"},"Overview · All 7"),
      el("span",{class:"nsc"},fmt(overall()))
    ));
    IMPERATIVES.forEach(im=>{
      const sc=impScores(im.n);
      nav.append(el("button",{class:activeImp===im.n?"active":"",onclick:()=>{activeImp=im.n;render();}},
        el("span",{class:"nbadge",style:`background:${im.hex}`},String(im.n)),
        el("span",{class:"nm"},im.name),
        el("span",{class:"nsc"},fmt(sc))
      ));
    });
    rail.append(nav);
    // foot stats
    const foot=el("div",{class:"rail-foot"});
    const submitted=participants.filter(p=>p.submitted).length;
    foot.append(
      el("div",{class:"rail-stat"}, el("span",{class:"rs-l"},"Participants"), el("span",{class:"rs-v"},String(participants.length))),
      el("div",{class:"rail-stat"}, el("span",{class:"rs-l"},"Submitted"), el("span",{class:"rs-v"},`${submitted}/${participants.length}`)),
      el("div",{class:"rail-stat"}, el("span",{class:"rs-l"},"Responses"), el("span",{class:"rs-v"},String(responses.length))),
      el("div",{class:"live-dot"}, el("i"), "Live")
    );
    rail.append(foot);
    return rail;
  }

  function renderMain(){
    const main=el("div",{class:"pr-main"});
    const focus = activeImp>0 ? IMPERATIVES[activeImp-1] : null;
    // header
    const head=el("div",{class:"pr-head"});
    head.append(
      el("div",{},
        el("h1",{}, focus ? focus.name : sess.title),
        el("div",{class:"ph-sub"}, focus ? focus.sub : "Live group assessment · 7 imperatives · 35 questions")
      )
    );
    const right=el("div",{style:"display:flex;align-items:center;gap:12px;flex-wrap:wrap"});
    const reveal=el("button",{class:"btn-reveal",onclick:async()=>{
      await sb.from("ar_sessions").update({status:sess.status==="revealed"?"open":"revealed"}).eq("id",session);
      sess.status=sess.status==="revealed"?"open":"revealed";
      toast(sess.status==="revealed"?"Results revealed":"Results hidden");
    }}, el("span",{html: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="#fff" stroke-width="2"/></svg>'}), "Show results");
    const pill=el("div",{class:"join-pill"},
      el("div",{class:"jp-code",html:`<small>Join code</small>${session}`}),
      el("div",{class:"qrbox"}, el("div",{id:"qr-box",style:"width:120px;height:120px;display:grid;place-items:center"}))
    );
    right.append(reveal,pill);
    head.append(right);
    main.append(head);

    // empty state
    if(participants.length===0){
      main.append(el("div",{class:"panel"}, el("div",{class:"panel-b",style:"text-align:center;padding:60px 20px"},
        el("div",{class:"feed-empty"},
          el("div",{class:"fe-spin"}),
          el("p",{},"Waiting for the first participant to scan the code…")
        )
      )));
      return main;
    }

    // stat strip
    const ov=overall(); const mt=ov!=null?maturityOf(ov):null;
    const strip=el("div",{class:"stat-strip"});
    strip.append(
      (()=>{ const s=el("div",{class:"stat"});
        s.append(el("div",{class:"st-l"},focus?`${focus.name} score`:"Group maturity"),
          el("div",{class:"st-v",html:`${fmt(focus?impScores(focus.n):ov)}<small>/5</small>`}));
        if(mt&&!focus) s.append(el("div",{},el("span",{class:"maturity-chip",style:`background:${mt.color}1f;color:${mt.color}`},mt.label)));
        else if(focus){ const fm=impScores(focus.n); if(fm!=null){const m2=maturityOf(fm); s.append(el("div",{},el("span",{class:"maturity-chip",style:`background:${m2.color}1f;color:${m2.color}`},m2.label)));} }
        return s; })(),
      (()=>{ const s=el("div",{class:"stat"});
        const done=participants.filter(p=>p.submitted).length;
        s.append(el("div",{class:"st-l"},"Respondents"),el("div",{class:"st-v",html:`${respondentCount()}<small> people</small>`}),
          el("div",{class:"st-foot"},`${done} fully submitted · ${participants.length-done} in progress`));
        return s; })(),
      (()=>{ const s=el("div",{class:"stat"});
        if(focus){ const sp=impSpread(focus.n);
          s.append(el("div",{class:"st-l"},"Agreement"),el("div",{class:"st-v",html:`σ ${sp.toFixed(1)}`}),
            el("div",{class:"st-foot"},sp<0.7?"Strong consensus":sp<1.1?"Some divergence":"High divergence"));
        } else {
          // most divergent imperative
          const dd=IMPERATIVES.map(im=>({im,sp:impSpread(im.n),n:responses.filter(r=>r.imperative===im.n).length})).filter(d=>d.n>=2).sort((a,b)=>b.sp-a.sp)[0];
          s.append(el("div",{class:"st-l"},"Most contested"),
            el("div",{class:"st-v",style:"font-size:18px;line-height:1.1;font-family:var(--sans);font-weight:700"}, dd?dd.im.short:"–"),
            el("div",{class:"st-foot"}, dd?`σ ${dd.sp.toFixed(1)} — biggest split`:"Need more responses"));
        }
        return s; })()
    );
    main.append(strip);

    // dashboard: radar + (imperative bars OR question detail) + insights
    const dash=el("div",{class:"dash"});

    // LEFT — radar (overview) or question distribution (focus)
    if(!focus){
      const radarPanel=el("div",{class:"panel"});
      const isPerson = radarSel!=="avg";
      const toggle=el("div",{class:"rtoggle"},
        el("button",{class:radarSel==="avg"?"on":"",onclick:()=>{radarSel="avg";tooltipAxis=null;render();}},"Average"),
        el("button",{class:isPerson?"on":"",onclick:()=>{radarSel="all";tooltipAxis=null;render();}},"By person")
      );
      const pidsWith = answeredPids();
      const chips=el("div",{class:"radar-people"});
      if(isPerson && pidsWith.length>0){
        chips.append(el("button",{class:"pchip mode"+(radarSel==="all"?" on":""),onclick:()=>{radarSel="all";tooltipAxis=null;render();}},
          el("span",{class:"pcdot",style:"background:linear-gradient(135deg,#0B5CD8,#7A3FF2)"}), `Everyone (${pidsWith.length})`));
        participants.forEach(p=>{
          if(!pidsWith.includes(p.id)) return;
          const col=pColor(p.id);
          const on = radarSel===p.id;
          const dim = radarSel!=="all" && !on;
          chips.append(el("button",{class:"pchip"+(on?" on":"")+(dim?" dim":""),
            style:on?`background:${col};`:`border-color:${col}`,
            onclick:()=>{radarSel = on?"all":p.id; tooltipAxis=null; render();}},
            el("span",{class:"pcdot",style:on?"background:#fff":`background:${col}`}),
            p.name.split(" ")[0]));
        });
      } else {
        IMPERATIVES.forEach(im=> chips.append(el("span",{class:"pchip",style:"cursor:default;border-color:var(--line-2)"},
          el("span",{class:"pcdot",style:`background:${im.hex}`}), im.short)));
      }
      const wrap=el("div",{class:"radar-wrap"}, el("div",{id:"radar-host"}));
      wrap.append(el("div",{id:"axis-tip-mount"}));
      radarPanel.append(
        el("div",{class:"panel-h"}, el("span",{class:"ph-t"},"Maturity Radar"),
          el("div",{style:"display:flex;align-items:center;gap:10px"},
            el("span",{class:"ph-meta"}, isPerson?"tap a spoke for detail":""), toggle)),
        el("div",{class:"panel-b"}, wrap, chips)
      );
      dash.append(radarPanel);
    } else {
      // focus: question-by-question distribution
      const qp=el("div",{class:"panel"});
      qp.append(el("div",{class:"panel-h"}, el("span",{class:"ph-t"},"Question breakdown"), el("span",{class:"ph-meta"},`${focus.q.length} questions`)));
      const qb=el("div",{class:"panel-b"});
      focus.q.forEach(([qid,dim])=>{
        const v=respByQ(qid); const m=mean(v); const sd=stdev(v);
        const counts=[0,0,0,0,0]; v.forEach(s=>counts[s-1]++); const maxc=Math.max(1,...counts);
        const row=el("div",{class:"qrow"+(sd>=1.3?" diverge":"")});
        row.append(el("div",{class:"qrow-top"},
          el("span",{class:"qid"},qid),
          el("span",{class:"qnm"},dim),
          el("span",{class:"qmean",style:`color:${scoreColor(m)}`},fmt(m))
        ));
        const dist=el("div",{class:"qrow-dist"});
        for(let i=0;i<5;i++){ const h=8+counts[i]/maxc*100;
          dist.append(el("div",{class:"distbar",style:`height:${counts[i]?h:8}%;${counts[i]?'':'background:var(--line-2)'}`},
            counts[i]?el("span",{class:"dc"},String(counts[i])):"",
            el("span",{class:"dl"},String(i+1))));
        }
        row.append(dist);
        qb.append(row);
      });
      qp.append(qb);
      dash.append(qp);
    }

    // RIGHT column — imperative bars + insights + participants
    const rightCol=el("div",{style:"display:flex;flex-direction:column;gap:18px"});

    if(!focus){
      // imperative bars
      const bars=el("div",{class:"panel"});
      bars.append(el("div",{class:"panel-h"}, el("span",{class:"ph-t"},"By imperative"), el("span",{class:"ph-meta"},"click to drill in")));
      const bb=el("div",{class:"panel-b"});
      IMPERATIVES.forEach(im=>{
        const m=impScores(im.n), sp=impSpread(im.n);
        const row=el("div",{class:"ibar"});
        row.append(el("div",{class:"ibar-top"},
          el("span",{class:"dot",style:`background:${im.hex}`}),
          el("span",{class:"nm",onclick:()=>{activeImp=im.n;render();}},`${im.n}. ${im.name}`),
          el("span",{class:"v",style:`color:${scoreColor(m)}`},fmt(m)),
          el("span",{class:"sp"}, m!=null?`σ${sp.toFixed(1)}`:"")
        ));
        const track=el("div",{class:"ibar-track"}, el("i",{style:`width:${(m||0)/5*100}%;background:${im.hex}`}));
        for(let t=1;t<5;t++) track.append(el("span",{class:"tick",style:`left:${t/5*100}%`}));
        row.append(track);
        bb.append(row);
      });
      bars.append(bb);
      rightCol.append(bars);
    }

    // INSIGHTS — always shown
    const ins=el("div",{class:"panel"});
    ins.append(el("div",{class:"panel-h"},
      el("span",{class:"ph-t",html:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px;margin-right:5px"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.6 10.8c.5.4.9 1.1.9 1.9v.3h5.4v-.3c0-.8.4-1.5.9-1.9A6 6 0 0012 3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Analysis engine'}),
      el("span",{class:"ph-meta"},"updates live")));
    const feed=el("div",{class:"panel-b"});
    const insList=el("div",{class:"feed"});
    let insights=computeInsights();
    if(focus) insights=insights.filter(i=>i.imp===focus.n||i.imp===0);
    if(insights.length===0){
      feed.append(el("div",{class:"feed-empty"}, el("div",{class:"fe-spin"}), el("p",{},responses.length===0?"Inferences begin once answers arrive":"Gathering enough responses to infer patterns…")));
    } else {
      const tagMeta={strength:["Strength","◆"],gap:["Priority gap","▲"],divergence:["Divergence","⇄"],consensus:["Consensus","●"]};
      insights.forEach(i=>{
        const [label]=tagMeta[i.k]||["Insight","•"];
        insList.append(el("div",{class:`insight k-${i.k}`},
          el("div",{class:"ins-tag"}, label + (i.imp>0?` · Imperative ${i.imp}`:"")),
          el("div",{class:"ins-body",html:i.body})
        ));
      });
      feed.append(insList);
    }
    ins.append(feed);
    rightCol.append(ins);

    // PARTICIPANTS
    const pplPanel=el("div",{class:"panel"});
    pplPanel.append(el("div",{class:"panel-h"}, el("span",{class:"ph-t"},"Participants"), el("span",{class:"ph-meta"},`${participants.length} joined`)));
    const pb=el("div",{class:"panel-b"});
    const ppl=el("div",{class:"ppl"});
    if(participants.length===0) pb.append(el("div",{style:"color:var(--faint);font-size:12.5px;text-align:center;padding:14px"},"No one has joined yet"));
    else participants.forEach(p=>{
      const pm = focus ? participantImpMean(p.id,focus.n) : participantMean(p.id);
      const answered = responses.filter(r=>r.participant_id===p.id).length;
      ppl.append(el("div",{class:"ppl-row"},
        el("span",{class:"pname",html:`${esc(p.name)}${p.role?` <span class="prole">· ${esc(p.role)}</span>`:""}`}),
        el("span",{class:"pavg",style:`color:${scoreColor(pm)}`},fmt(pm)),
        el("span",{class:`pstat ${p.submitted?"done":"live"}`}, p.submitted?"Done":`${answered}/35`)
      ));
    });
    pb.append(ppl);
    pplPanel.append(pb);
    rightCol.append(pplPanel);

    dash.append(rightCol);
    main.append(dash);
    return main;
  }

  // ── RADAR (flower) ────────────────────────────────────────────────────
  function drawRadar(){
    const host=$("#radar-host"); if(!host) return;
    const size=560, cx=size/2, cy=size/2, R=size*0.34, rings=5;
    const NS="http://www.w3.org/2000/svg";
    const svg=document.createElementNS(NS,"svg"); svg.setAttribute("viewBox",`0 0 ${size} ${size}`);
    const axes=ALLQ.map((q,i)=>({...q,ang:(i/ALLQ.length)*2*Math.PI - Math.PI/2}));
    const pt=(ang,r)=>[cx+Math.cos(ang)*r, cy+Math.sin(ang)*r];
    const mk=(tag,attrs)=>{ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; };

    // grid rings
    for(let r=1;r<=rings;r++){
      const rr=R*r/rings;
      svg.append(mk("polygon",{points:axes.map(a=>pt(a.ang,rr).join(",")).join(" "),fill:"none",
        stroke:r===rings?"#D4DCEA":"#EAEFF6","stroke-width":r===rings?"1.4":"1"}));
    }
    for(let r=1;r<=rings;r++){ const [x,y]=pt(-Math.PI/2,R*r/rings);
      const t=mk("text",{x:x+5,y:y+3,"font-size":"9",fill:"#AEB9CC","font-weight":"700","font-family":"var(--mono)"}); t.textContent=r; svg.append(t); }

    // spokes
    axes.forEach(a=>{ const [x,y]=pt(a.ang,R);
      svg.append(mk("line",{x1:cx,y1:cy,x2:x,y2:y,stroke:"#EEF2F8","stroke-width":"1"})); });

    // ── data layers ──
    const pids = answeredPids();
    const isolate = (radarSel!=="avg" && radarSel!=="all") ? radarSel : null;
    const polyFor=(pid)=> axes.map(a=>{ const r=responses.find(x=>x.participant_id===pid&&x.qid===a.qid); return pt(a.ang, R*((r?r.score:0))/5).join(","); }).join(" ");

    if(responses.length>0){
      if(radarSel==="avg"){
        const poly=axes.map(a=>{ const m=qMean(a.qid)||0; return pt(a.ang, R*m/5).join(","); }).join(" ");
        svg.append(mk("polygon",{points:poly,fill:hexA("#0B5CD8",.14),stroke:"#0B5CD8","stroke-width":"2.6","stroke-linejoin":"round"}));
        axes.forEach(a=>{ const m=qMean(a.qid); if(m==null)return; const [x,y]=pt(a.ang,R*m/5);
          svg.append(mk("circle",{cx:x,cy:y,r:"4",fill:a.hex,stroke:"#fff","stroke-width":"1.6"})); });
      } else {
        // filled translucent polygon per participant (stained-glass overlay)
        pids.forEach(pid=>{
          const col=pColor(pid);
          const faded = isolate && pid!==isolate;
          svg.append(mk("polygon",{points:polyFor(pid),
            fill: faded?"none":hexA(col,.16),
            stroke: faded?"#C7D0DE":col,
            "stroke-width": faded?"1":"1.8",
            "stroke-opacity": faded?".5":".95",
            "stroke-linejoin":"round"}));
        });
        // average reference (dashed) — hidden while isolating to reduce clutter
        if(!isolate){
          const poly=axes.map(a=>{ const m=qMean(a.qid)||0; return pt(a.ang, R*m/5).join(","); }).join(" ");
          svg.append(mk("polygon",{points:poly,fill:"none",stroke:"#0E1726","stroke-width":"2","stroke-dasharray":"3 3","stroke-linejoin":"round","stroke-opacity":".55"}));
        }
        // white-ringed vertex dots (only for visible/active people)
        pids.forEach(pid=>{
          if(isolate && pid!==isolate) return;
          const col=pColor(pid);
          axes.forEach(a=>{ const r=responses.find(x=>x.participant_id===pid&&x.qid===a.qid); if(!r) return;
            const [x,y]=pt(a.ang, R*r.score/5);
            svg.append(mk("circle",{cx:x,cy:y,r: isolate?"4.5":"3.4",fill:col,stroke:"#fff","stroke-width": isolate?"1.8":"1.3"})); });
        });
      }
    }

    // outer dots colored by imperative + invisible tap targets
    axes.forEach((a,i)=>{
      const [dx,dy]=pt(a.ang,R+11);
      svg.append(mk("circle",{cx:dx,cy:dy,r:"4.5",fill:a.hex}));
      // small qid label
      const [lx,ly]=pt(a.ang,R+21);
      const cosv=Math.cos(a.ang);
      const tl=mk("text",{x:lx,y:ly+3,"font-size":"7.5",fill:"#AEB9CC","font-weight":"700","font-family":"var(--mono)",
        "text-anchor":Math.abs(cosv)<0.25?"middle":(cosv>0?"start":"end")}); tl.textContent=a.qid; svg.append(tl);
      // invisible wide hit area along the spoke for tapping
      const [ex,ey]=pt(a.ang,R+16);
      const hit=mk("line",{x1:cx,y1:cy,x2:ex,y2:ey,stroke:"transparent","stroke-width":"15",style:"cursor:pointer"});
      hit.addEventListener("click",(ev)=>{ ev.stopPropagation(); tooltipAxis = (tooltipAxis===i?null:i); render(); });
      svg.append(hit);
    });

    // imperative arc labels
    IMPERATIVES.forEach(im=>{
      const idxs=ALLQ.map((q,i)=>q.imp===im.n?i:-1).filter(i=>i>=0);
      const midIdx=(idxs[0]+idxs[idxs.length-1])/2;
      const ang=(midIdx/ALLQ.length)*2*Math.PI - Math.PI/2;
      const [lx,ly]=pt(ang,R+40);
      const cosv=Math.cos(ang);
      const t=mk("text",{x:lx,y:ly,"font-size":"11","font-weight":"700",fill:im.hex,"font-family":"var(--sans)",
        "text-anchor":Math.abs(cosv)<0.3?"middle":(cosv>0?"start":"end")}); t.textContent=im.short; svg.append(t);
    });

    // tapping empty radar closes tooltip
    svg.addEventListener("click",()=>{ if(tooltipAxis!=null){ tooltipAxis=null; render(); } });

    host.innerHTML=""; host.append(svg);

    // ── axis tooltip (HTML overlay, % positioned so it tracks any size) ──
    const mount=$("#axis-tip-mount");
    if(mount && tooltipAxis!=null){
      const a=axes[tooltipAxis];
      const q=ALLQ[tooltipAxis];
      const [tx,ty]=pt(a.ang,R*0.62);
      const onRight = tx<=cx;
      const tip=el("div",{class:"axis-tip"});
      tip.style.left = (tx/size*100)+"%";
      tip.style.top  = (ty/size*100)+"%";
      tip.style.transform = `translate(${onRight?"8px":"-100%"}, -50%) ${onRight?"":"translateX(-8px)"}`;
      tip.append(el("span",{class:"at-x",onclick:(e)=>{e.stopPropagation();tooltipAxis=null;render();}},"✕"));
      tip.append(el("div",{class:"at-q"},`Imperative ${q.imp} · ${q.qid}`), el("div",{class:"at-d"},q.dim));
      const rows = participants
        .map(p=>({p, r:responses.find(x=>x.participant_id===p.id&&x.qid===q.qid)}))
        .filter(o=>o.r)
        .sort((x,y)=>y.r.score-x.r.score);
      if(rows.length===0){ tip.append(el("div",{class:"at-none"},"No responses yet")); }
      else {
        rows.forEach(({p,r})=> tip.append(el("div",{class:"at-row"},
          el("span",{class:"at-sw",style:`background:${pColor(p.id)}`}),
          el("span",{class:"at-nm"},p.name.split(" ")[0]),
          el("span",{class:"at-sc"},String(r.score)))));
        const m=qMean(q.qid);
        tip.append(el("div",{class:"at-avg"}, el("span",{},"Average"), el("b",{},fmt(m))));
      }
      tip.addEventListener("click",e=>e.stopPropagation());
      mount.append(tip);
    }
  }

  render();

  // ── REALTIME ──────────────────────────────────────────────────────────
  let renderQueued=false;
  function liveRefresh(){ if(renderQueued) return; renderQueued=true;
    setTimeout(async()=>{ renderQueued=false; await loadAll(); render(); }, 280); }

  sb.channel(`ar_live_${session}`)
    .on("postgres_changes",{event:"*",schema:"public",table:"ar_responses",filter:`session_id=eq.${session}`}, liveRefresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"ar_participants",filter:`session_id=eq.${session}`}, liveRefresh)
    .subscribe();

  // gentle poll fallback in case realtime drops
  setInterval(liveRefresh, 12000);
}
</script>
</body>
</html>
